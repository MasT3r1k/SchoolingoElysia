<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap');
        body { font-family: 'Inter', sans-serif; padding: 40px; color: #111; }
        .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; border-bottom: 2px solid #333; padding-bottom: 15px; }
        .header h1 { margin: 0; font-size: 24px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Celkový přehled známek: {{studentName}}</h1>
        <div style="text-align: right; font-size: 13px;">Datum: {{genDate}}</div>
    </div>
    <div style="margin-top: 20px;">
        <p>Tento dokument bude obsahovat přehled známek za celé období studia (výpis z katalogového listu).</p>
        <pre>{{json reportData}}</pre>
    </div>
</body>
</html>
